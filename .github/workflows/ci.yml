name: CI/CD

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd fault-service
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: |
          cd fault-service
          pytest tests/ -v
